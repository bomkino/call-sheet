name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python3 tools/build_site.py --out "$RUNNER_TEMP/call-sheet"
      - name: Data and page checks
        run: python3 -m unittest discover -s tools -p 'test*.py'
      - name: Script parses
        run: node --check site/call-sheet.js
